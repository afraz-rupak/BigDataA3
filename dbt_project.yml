name: 'assignment3_dbt'
version: '1.0.0'
config-version: 2

profile: 'assignment3'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  assignment3_dbt:
    # Silver layer - Staging/Cleaned data
    silver:
      +materialized: table
      +schema: silver
      
    # Gold layer - Star schema
    gold:
      +materialized: table
      +schema: gold
      dimensions:
        +materialized: table
        +schema: gold
      facts:
        +materialized: table
        +schema: gold
        
    # Datamart layer - Business views
    datamart:
      +materialized: view
      +schema: datamart

snapshots:
  assignment3_dbt:
    +target_schema: silver
    +strategy: timestamp
    +unique_key: id
