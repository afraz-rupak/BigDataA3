version: 2

sources:
  - name: bronze
    description: Bronze layer containing raw data from source systems
    database: postgres
    schema: bronze
    tables:
      - name: raw_listings
        description: Raw Airbnb listings data
        
      - name: raw_census_g01
        description: Raw Census 2016 G01 data (Person Characteristics)
        
      - name: raw_census_g02
        description: Raw Census 2016 G02 data (Medians and Averages)
        
      - name: raw_lga_code
        description: Raw LGA code to name mapping
        
      - name: raw_lga_suburb
        description: Raw LGA to suburb mapping

models:
  - name: stg_listings
    description: Cleaned and standardized Airbnb listings data
    columns:
      - name: listing_id
        description: Unique identifier for each listing (note - same listing can appear multiple times for different scraped_dates)
        tests:
          - not_null
          
      - name: scraped_date
        description: Date when the listing data was scraped
        tests:
          - not_null
          
      - name: host_id
        description: Unique identifier for the host
        tests:
          - not_null
          
      - name: price
        description: Nightly price in local currency
        tests:
          - not_null
          
      - name: data_quality_flag
        description: Flag indicating data quality status
        
  - name: stg_census_g01
    description: Cleaned Census 2016 G01 person characteristics data
    columns:
      - name: lga_code
        description: LGA code (2016 boundaries)
        tests:
          - not_null
          
      - name: total_persons
        description: Total population count
        
  - name: stg_census_g02
    description: Cleaned Census 2016 G02 medians and averages data
    columns:
      - name: lga_code
        description: LGA code (2016 boundaries)
        tests:
          - not_null
          
      - name: median_household_income_weekly
        description: Median total household income (weekly)
        
  - name: stg_lga_code
    description: Cleaned LGA code to name mapping
    columns:
      - name: lga_code
        description: Standardized LGA code
        tests:
          - not_null
          
      - name: lga_name
        description: LGA name
        tests:
          - not_null
          
  - name: stg_lga_suburb
    description: Cleaned LGA to suburb mapping
    columns:
      - name: lga_suburb_key
        description: Unique identifier for LGA-Suburb combination
        tests:
          - not_null